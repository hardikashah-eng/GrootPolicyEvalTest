id: execute/mug-to-rack/v3
release: 2026-12
track: execute
instruction: ["Put the mug in the dish rack", "Could you rack that mug?", "The mug goes in the drying rack, please"]
scene:
  objects:
    mug: {usd: assets/mug_ceramic_a.usd, real_sku: MUG-A-350ML, mass_kg: 0.32}
    rack: {usd: assets/dish_rack_b.usd, real_sku: RACK-B, fixed: true}
variation:
  mug.xy_m: {uniform: [[-0.10, -0.10], [0.10, 0.10]]}
  mug.yaw_deg: {uniform: [-180, 180]}
  mug.model: {choice: [mug_ceramic_a, mug_ceramic_b, mug_steel_c]}
  lighting_lux: {uniform: [200, 800]}
success:
  all:
    - inside: {object: mug, region: rack.slots}
    - tilt_deg: {object: mug, max: 20}
    - hold_s: 2.0
subgoals:
  - {name: lifted, check: {joint_min: {joint: mug.height_m, min: 0.05}}}
  - {name: in_rack, check: {inside: {object: mug, region: rack.slots}}}
  - {name: upright, check: {tilt_deg: {object: mug, max: 20}}}
limits: {timeout_s: 90, max_contact_force_n: 40}
