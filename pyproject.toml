[project]
name = "groot-policy-eval"
version = "0.1.0"
description = "Evaluation harness for robot foundation-model policies (Isaac GR00T): open-loop and closed-loop evals, randomization sweeps, confidence intervals, regression suites, and sim-to-real correlation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6.0",
  # One actuator/scheduler code path for NumPy (CPU) and torch (Isaac Lab, GPU).
  "array-api-compat>=1.11",
]

[project.optional-dependencies]
# Talking to a running Isaac-GR00T inference server needs the gr00t package itself.
groot = []
# Isaac Lab must be installed per its own instructions (it ships with Isaac Sim).
isaaclab = ["gymnasium>=0.29"]
video = ["opencv-python>=4.8"]
# Reading Isaac Lab / robomimic HDF5 demonstrations (groot-twin convert-check, convert).
hdf5 = ["h5py>=3.9", "opencv-python>=4.8"]

[project.scripts]
groot-eval = "groot_eval.cli:main"
groot-twin = "groot_eval.twin_cli:main"
groot-robot = "groot_eval.robot_cli:main"

[dependency-groups]
dev = ["pytest>=8", "h5py>=3.9", "opencv-python>=4.8", "array-api-strict>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
