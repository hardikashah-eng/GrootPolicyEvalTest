# Type-check settings used by the mypy pre-commit hook.
# The hook passes only the staged files, and follow_imports = silent reports errors
# only for those files, so existing type debt surfaces as files are touched.
[mypy]
python_version = 3.10
mypy_path = src
explicit_package_bases = True
follow_imports = silent
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True

# Type-error baseline: modules with errors when the hook was introduced.
# They are skipped until fixed; remove a module from this list once it is clean.
# Every module not listed here (including new ones) is checked.
[mypy-groot_eval.trace,groot_eval.repro,groot_eval.twin_metrics,groot_eval.open_loop,groot_eval.gap,groot_eval.fidelity,groot_eval.conversion_fidelity,groot_eval.policies.scripted,groot_eval.analysis,groot_eval.suites,groot_eval.regression,groot_eval.degradation.faults,groot_eval.checks,groot_eval.replay,groot_eval.latency,groot_eval.envs.reach2d,groot_eval.envs.arm3,groot_eval.degradation.wear,groot_eval.cli,groot_eval.real2sim,groot_eval.transfer,groot_eval.twin_cli,groot_eval.degradation.calibrate,groot_eval.envs.objects,examples.run_real2sim_demo,examples.run_sim2real_demo,examples.run_robustness_demo,tests.test_checks]
ignore_errors = True
